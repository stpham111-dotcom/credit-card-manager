<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="50%" stop-color="#056c4c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect x="4" y="10" width="56" height="44" rx="9" fill="url(#bg)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Magnetic/Contactless waves -->
  <path d="M42 22a6 6 0 0 1 0 8" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M46 19a10 10 0 0 1 0 14" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Gold Chip -->
  <rect x="12" y="20" width="12" height="10" rx="2" fill="url(#gold)"/>
  <line x1="12" y1="25" x2="24" y2="25" stroke="#78350f" stroke-width="0.8"/>
  <line x1="18" y1="20" x2="18" y2="30" stroke="#78350f" stroke-width="0.8"/>
  <!-- Embossed card details mockup -->
  <rect x="12" y="38" width="22" height="3" rx="1.5" fill="#f8fafc" opacity="0.9"/>
  <rect x="12" y="44" width="14" height="2" rx="1" fill="#94a3b8" opacity="0.7"/>
  <!-- Platinum Hologram Circle -->
  <circle cx="50" cy="43" r="4.5" fill="#38bdf8" opacity="0.8"/>
</svg>
